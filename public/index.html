<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pod Pulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <p class="label">BEGINNER DEVOPS PROJECT</p>
    <h1>Pod Pulse</h1>
    <p class="intro">A tiny app for learning Docker and Kubernetes.</p>

    <div class="status">
      <span class="dot"></span>
      <span id="status">Loading...</span>
    </div>

    <section>
      <p>Container or Pod</p>
      <strong id="pod">Loading...</strong>
    </section>

    <section>
      <p>App uptime</p>
      <strong id="uptime">Loading...</strong>
    </section>

    <button id="refresh">Check again</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
